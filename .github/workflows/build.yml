name: Build and test
'on':
  push:
    branches:
    - '**'
    tags:
    - '**'
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      release: ${{ steps.policy.outputs.release }}
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Record actual runner and toolchain
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-actual-runner-and-toolchain
    - name: Audit public files and reachable history
      # Workflow checks run even when the subsequent policy selects docs only.
      run: |
        cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/Audit.cmake
        cmake -DROOT="$GITHUB_WORKSPACE" -DMODE=worktree -P cmake/Audit.cmake
        cmake -DROOT="$GITHUB_WORKSPACE" -DMODE=history -P cmake/Audit.cmake
        cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckSecrets.cmake
      id: audit-public-files-and-reachable-history
    - name: Analyze workflows and Bash commands
      run: cmake -DROOT="$GITHUB_WORKSPACE" -DWORK="$GITHUB_WORKSPACE/build/workflow-lint" -P cmake/RunWorkflowLint.cmake
      id: analyze-workflows
    - name: Test CI selection and final gate
      run: |-
        mkdir -p build/ci-reports
        python3 -I -S -B -m unittest discover -s tests/maintenance -p "test_ci_*.py" -v 2>&1 | tee build/ci-reports/unittest.log
      id: test-ci-selection-and-final-gate
    - name: Select checks from verified history
      id: policy
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 cmake/ci_policy.py plan
    - name: Validate release tag before building
      if: ${{ steps.policy.outputs.release == 'true' }}
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        BUILD_COMMIT: ${{ github.sha }}
      run: cmake -DROOT="$GITHUB_WORKSPACE" -DTAG="$RELEASE_TAG" -DCOMMIT="$BUILD_COMMIT" -P cmake/CheckReleaseTag.cmake
      id: validate-release-tag-before-building
    - name: Save test reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: audit-tests
        path: |
          build/ci-reports/
          build/workflow-lint/*.json
          build/workflow-lint/*.log
        retention-days: 14
      id: save-test-reports
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  static-analysis:
    needs: audit
    if: ${{ needs.audit.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: checkout
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: ninja
    - name: Install Clang and clang-tidy
      run: |-
        sudo apt-get update -qq
        sudo apt-get install -y clang-${{ steps.tools.outputs.tidy-llvm }} clang-tidy-${{ steps.tools.outputs.tidy-llvm }}
        clang-tidy-${{ steps.tools.outputs.tidy-llvm }} --version
      id: clang
    - name: Record actual runner and toolchain
      run: cmake -P cmake/CiEnvironment.cmake
      id: environment
    - name: Compute Cppcheck tool key
      run: cmake -P cmake/AnalysisToolKey.cmake
      id: key
    - name: Restore Cppcheck tool
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/static-analysis-linux/tools/cppcheck/install
        key: ${{ steps.key.outputs.key }}
      continue-on-error: true
      id: cppcheck-cache
    - name: Prepare and validate Cppcheck
      run: |-
        mkdir -p build/static-analysis-linux/analysis
        cmake -DKIND=cppcheck -DWORK="$GITHUB_WORKSPACE/build/static-analysis-linux/tools/cppcheck" -P cmake/SetupAnalysisTools.cmake 2>&1 | tee build/static-analysis-linux/analysis/tool-setup.log
      id: cppcheck
    - name: Save validated Cppcheck tool
      if: ${{ steps.cppcheck.outcome == 'success' && steps.cppcheck-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/static-analysis-linux/tools/cppcheck/install
        key: ${{ steps.key.outputs.key }}
      continue-on-error: true
      id: save-cppcheck
    - name: Analyze portable C++
      run: |-
        cmake --preset static-analysis-linux 2>&1 | tee build/static-analysis-linux/analysis/configure.log
        cmake --build --preset static-analysis-linux --parallel 4 2>&1 | tee build/static-analysis-linux/analysis/run.log
      id: analyze
    - name: Save analysis diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: static-analysis-linux
        path: build/static-analysis-linux/analysis/
        retention-days: 14
      id: save-analysis
    - name: Publish job summary
      if: always()
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; analysis reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  portable:
    needs: audit
    if: ${{ needs.audit.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Record actual runner and toolchain
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-actual-runner-and-toolchain
    - name: Build and test portable code and build contracts
      run: |-
        cmake --preset native
        cmake --build --preset native --parallel 4
        ctest --preset native --output-junit "$GITHUB_WORKSPACE/build/native/ci-tests.xml"
      id: build-and-test-portable-code-and-build-contracts
    - name: Test maintenance tooling
      run: |-
        mkdir -p build/ci-reports
        python3 -I -S -B -m unittest discover -s tests/maintenance -p "test_*.py" -v 2>&1 | tee build/ci-reports/unittest.log
      id: test-maintenance-tooling
    - name: Save test reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: portable-tests
        path: |
          build/ci-reports/
          build/native/ci-tests.xml
          build/native/**/Testing/Temporary/LastTest.log
        retention-days: 14
      id: save-test-reports
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  sanitizers:
    needs: audit
    if: ${{ needs.audit.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Record actual runner and toolchain
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-actual-runner-and-toolchain
    - name: Build and test with ASan and UBSan
      run: |-
        cmake --preset sanitizers-linux
        cmake --build --preset sanitizers-linux --parallel 4
        ctest --preset sanitizers-linux --output-junit "$GITHUB_WORKSPACE/build/sanitizers-linux/ci-tests.xml"
      id: build-and-test-with-asan-and-ubsan
    - name: Save test reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sanitizers-tests
        path: |
          build/ci-reports/
          build/sanitizers-linux/ci-tests.xml
          build/sanitizers-linux/**/Testing/Temporary/LastTest.log
        retention-days: 14
      id: save-test-reports
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  fuzz:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Install pinned Ninja and LLVM 18 fuzz runtime
      run: |
        cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
        sudo apt-get update -qq
        sudo apt-get install -y clang-${{ steps.tools.outputs.fuzz-llvm }} libclang-rt-${{ steps.tools.outputs.fuzz-llvm }}-dev
      id: install-pinned-ninja-and-llvm-18-fuzz-runtime
    - name: Build fuzzers and seed corpora
      run: |
        cmake --preset fuzz-linux
        cmake --build --preset fuzz-linux --parallel 4
      id: build-fuzzers-and-seed-corpora
    - name: Fuzz BLE and CDC under ASan and UBSan
      run: ctest --preset fuzz-linux --verbose --output-junit "$GITHUB_WORKSPACE/build/fuzz-linux/ci-tests.xml"
      id: fuzz-ble-and-cdc-under-asan-and-ubsan
    - name: Record analysis tool versions
      if: always()
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-analysis-tool-versions
    - name: Save fuzz corpora, crashes and diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fuzz-linux
        retention-days: 14
        path: |
          build/fuzz-linux/fuzz/
          build/fuzz-linux/Testing/
          build/fuzz-linux/ci-tests.xml
      id: save-fuzz-corpora-crashes-and-diagnostics
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
    if: ${{ needs.audit.outputs.mode == 'full' }}
  valgrind:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Install pinned Ninja and Valgrind
      run: |
        cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
        sudo apt-get update -qq
        sudo apt-get install -y valgrind
      id: install-pinned-ninja-and-valgrind
    - name: Build uninstrumented Debug tests
      run: |
        cmake --preset valgrind-linux
        cmake --build build/valgrind-linux --target native-tests valgrind_control --parallel 4
      id: build-uninstrumented-debug-tests
    - name: Verify Valgrind version and error exit policy
      run: cmake -DCONTROL="$GITHUB_WORKSPACE/build/valgrind-linux/tests/native/valgrind_control" -DWORK="$GITHUB_WORKSPACE/build/valgrind-linux/valgrind-policy"
        -P tests/cmake/valgrind_policy_test.cmake
      id: verify-valgrind-version-and-error-exit-policy
    - name: Check native tests for memory errors and leaks
      run: ctest --test-dir build/valgrind-linux -T memcheck -L coverage --output-on-failure --timeout 180 --parallel 2 --overwrite MemoryCheckCommand=/usr/bin/valgrind
        --overwrite "MemoryCheckCommandOptions=--tool=memcheck --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect,possible
        --track-origins=yes --error-exitcode=99 --num-callers=30"
      id: check-native-tests-for-memory-errors-and-leaks
    - name: Record analysis tool versions
      if: always()
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-analysis-tool-versions
    - name: Save Memcheck reports and policy diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: valgrind-linux
        retention-days: 14
        path: |
          build/valgrind-linux/Testing/
          build/valgrind-linux/valgrind-policy/
      id: save-memcheck-reports-and-policy-diagnostics
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
    if: ${{ needs.audit.outputs.mode == 'full' }}
  mutation:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Select pinned host compiler
      run: |-
        g++-${{ steps.tools.outputs.gcc }} --version
        echo "CXX=g++-${{ steps.tools.outputs.gcc }}" >> "$GITHUB_ENV"
      id: select-pinned-host-compiler
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Install pinned Ninja
      run: cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
      id: install-pinned-ninja
    - name: Install pinned Ninja and LLVM 18
      run: |
        cmake -DDESTINATION="$RUNNER_TEMP/allpowers-ninja" -P cmake/SetupNinja.cmake
        sudo apt-get update -qq
        sudo apt-get install -y clang-${{ steps.tools.outputs.mull-llvm }} libclang-cpp${{ steps.tools.outputs.mull-llvm }} llvm-${{ steps.tools.outputs.mull-llvm }}-dev libclang-${{ steps.tools.outputs.mull-llvm }}-dev
      id: install-pinned-ninja-and-llvm-18
    - name: Extract verified Mull package
      run: cmake -DWORK="$GITHUB_WORKSPACE/build/mutation-linux/tools/mull" -P cmake/SetupMutation.cmake
      id: extract-verified-mull-package
    - name: Configure mutation tests
      run: cmake --preset mutation-linux
      id: configure-mutation-tests
    - name: Test mutation report tooling
      run: |-
        mkdir -p build/ci-reports
        python3 -I -S -B -m unittest discover -s tests/maintenance -p "test_mutation_report.py" -v 2>&1 | tee build/ci-reports/unittest.log
      id: test-mutation-report-tooling
    - name: Run mutation analysis and reject unreviewed survivors
      run: cmake --build --preset mutation-linux --parallel 2
      id: run-mutation-analysis-and-reject-unreviewed-survivors
    - name: Record analysis tool versions
      if: always()
      run: cmake -P cmake/CiEnvironment.cmake
      id: record-analysis-tool-versions
    - name: Save mutation reports and diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mutation-linux
        retention-days: 14
        path: |
          build/mutation-linux/mutation/
          build/mutation-linux/mutation-policy/
          build/ci-reports/
      id: save-mutation-reports-and-diagnostics
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
    if: ${{ needs.audit.outputs.mode == 'full' }}
  windows-sdk:
    needs: audit
    if: ${{ needs.audit.outputs.mode == 'full' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Set up MSVC and Windows SDK
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:

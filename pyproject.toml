[project]
name = "allpowers"
version = "0.3.0"
description = "Shared ALLPOWERS BLE telemetry core, USB UPS adapters and Windows monitor"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = []

[dependency-groups]
build = ["cmake==3.31.6", "ninja==1.11.1.4", "ziglang==0.13.0"]
desktop = ["aqtinstall==3.3.0"]
dev = ["clang-format==18.1.8"]
maintenance = ["hidapi==0.15.0", "pyserial==3.5", "esptool==5.1.0"]

[tool.uv]
package = false
default-groups = ["build", "desktop"]

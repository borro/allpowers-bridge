    - if: always()
      name: Save coverage and test diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-linux
        path: |
          build/coverage-linux/coverage/
          build/coverage-linux/**/Testing/Temporary/LastTest.log
          build/coverage-linux/**/*-tests.xml
          build/coverage-linux/**/*-err.log
          build/coverage-linux/**/*-out.log
          build/ci-reports/
          build/coverage-linux/ci-tests.xml
        retention-days: 14
      id: save-coverage-and-test-diagnostics
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
    permissions:
      contents: read
      id-token: write

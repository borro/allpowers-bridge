name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit public files and reachable history
        run: |
          cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/Audit.cmake
          cmake -DROOT="$GITHUB_WORKSPACE" -DMODE=worktree -P cmake/Audit.cmake
          cmake -DROOT="$GITHUB_WORKSPACE" -DMODE=history -P cmake/Audit.cmake
          cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckSecrets.cmake
  products:
    needs: audit
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows
            products: all-windows
          - os: ubuntu-24.04
            preset: native
            products: all-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
        with:
          cmake-version: '4.4.4'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # MSVC environment
        with:
          arch: x64
          toolset: '14.51'
          sdk: '10.0.26100.0'
      - name: Verify pinned MSVC toolset
        if: runner.os == 'Windows'
        run: cmake -P cmake/CheckMsvcToolchain.cmake
      - name: Check build tools
        run: |
          cmake --version
          ninja --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deps/downloads
            build/deps/arduino
            build/deps/arduino-cli
          key: ${{ runner.os }}-${{ runner.arch }}-downloads-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/SetupArduino.cmake') }}
      - name: Configure
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || '' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: cmake --preset ${{ matrix.preset }} -DALLPOWERS_RELEASE_TAG="$RELEASE_TAG" -DALLPOWERS_RELEASE_COMMIT="$RELEASE_COMMIT"
      - run: cmake --build build/${{ matrix.preset }} --target arduino-setup
      - run: cmake --build --preset ${{ matrix.products }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - if: runner.os == 'Windows'
        run: cmake --build --preset release
      - run: cmake --build build/${{ matrix.preset }} --target audit
      - run: git diff --exit-code
      - name: Check for unexpected public files
        shell: bash
        run: test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allpowers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/firmware/
            dist/AllpowersMonitor-*.zip
            dist/AllpowersMonitor-*.zip.sha256
      - name: Save test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-${{ runner.os }}
          retention-days: 7
          path: |
            build/**/Testing/Temporary/LastTest.log
            build/**/desktop-tests.txt
            build/**/widget-tests.txt
            build/**/*-err.log
            build/**/*-out.log
  release:
    needs: [audit, products]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '4.4.4'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: cmake "-DROOT=$env:GITHUB_WORKSPACE" "-DTAG=$env:RELEASE_TAG" "-DCOMMIT=$env:BUILD_COMMIT" -P cmake/CheckReleaseTag.cmake
      - name: Download this run's checked Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name allpowers-Windows --dir build/release-input
      - name: Prepare and verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cmake "-DINPUT=$env:GITHUB_WORKSPACE/build/release-input" "-DOUTPUT=$env:GITHUB_WORKSPACE/build/release-assets" "-DTAG=$env:RELEASE_TAG" -P cmake/PrepareRelease.cmake
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./cmake/PublishRelease.ps1 -Repository "$env:GITHUB_REPOSITORY" -Tag "$env:RELEASE_TAG" -Assets build/release-assets

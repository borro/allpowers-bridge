name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --locked
      - run: uv run --locked python tools/build.py test
      - run: uv run --locked python tools/build.py setup
      - run: uv run --locked python tools/build.py all
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/windows/AllpowersMonitor/AllpowersMonitor.exe -ArgumentList '--self-test --report build/self-test.json -platform offscreen' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native application self-test failed' }
      - run: uv run --locked python tools/audit.py
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: allpowers-${{ runner.os }}
          path: dist/

        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  ci-result:
    name: ${{ needs.audit.outputs.mode == 'delegated' && 'CI delegated to PR' || 'CI result' }}
    needs:
    - audit
    - portable
    - static-analysis
    - sanitizers
    - fuzz
    - valgrind
    - mutation
    - windows-sdk
    - coverage-linux
    - coverage-windows
    - firmware
    - windows
    if: ${{ always() && needs.audit.outputs.mode != 'delegated' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Require all planned checks
      env:
        CI_MODE: ${{ needs.audit.outputs.mode }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python3 cmake/ci_policy.py gate
      id: require-all-planned-checks
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python3 -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi
  release:
    needs:
    - audit
    - ci-result
    if: ${{ needs.audit.outputs.release == 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
    steps:
    - name: Check out source and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      id: check-out-source-and-tags
    - name: Read pinned tool versions
      id: tools
      run: cmake -P cmake/CiTools.cmake
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
      with:
        cmake-version: ${{ steps.tools.outputs.cmake }}
      id: set-up-cmake
    - name: Verify release tag
      id: release-identity
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        BUILD_COMMIT: ${{ github.sha }}
      run: |
        cmake "-DROOT=$env:GITHUB_WORKSPACE" "-DTAG=$env:RELEASE_TAG" "-DCOMMIT=$env:BUILD_COMMIT" -P cmake/CheckReleaseTag.cmake
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $commit = git rev-parse --verify "$env:BUILD_COMMIT^{commit}"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        "commit=$commit" >> $env:GITHUB_OUTPUT
    - name: Download this run's checked Windows artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: windows-products
        path: build/release-input
      id: download-this-run-s-checked-windows-artifacts
    - name: Download checked Linux firmware
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: firmware-linux
        path: build/release-input/firmware
      id: download-checked-linux-firmware
    - name: Prepare and verify release assets
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        BUILD_COMMIT: ${{ steps.release-identity.outputs.commit }}
      run: cmake "-DINPUT=$env:GITHUB_WORKSPACE/build/release-input" "-DOUTPUT=$env:GITHUB_WORKSPACE/build/release-assets" "-DTAG=$env:RELEASE_TAG" "-DCOMMIT=$env:BUILD_COMMIT"
        -DEXPECTED_FIRMWARE_HOST=Linux -P cmake/PrepareRelease.cmake
      id: prepare-and-verify-release-assets
    - name: Publish complete release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: ./cmake/PublishRelease.ps1 -Repository "$env:GITHUB_REPOSITORY" -Tag "$env:RELEASE_TAG" -Assets build/release-assets
      id: publish-complete-release
    - name: Publish job summary
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS: ${{ toJSON(steps) }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        if [ -f cmake/ci_summary.py ]; then
          python -I -S -B cmake/ci_summary.py
        else
          printf '## %s — %s\n\nCheckout did not complete; test reports are unavailable.\n' "$GITHUB_JOB" "$CI_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        fi

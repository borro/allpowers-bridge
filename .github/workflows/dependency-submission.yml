name: C/C++ dependency graph
'on':
  push:
    branches: [main]
    paths:
    - cmake/Dependencies.cmake
    - cmake/ExportDependencies.cmake
    - cmake/dependency_snapshot.py
    - tests/maintenance/test_dependency_snapshot.py
    - .github/workflows/dependency-submission.yml
  pull_request:
    paths:
    - cmake/Dependencies.cmake
    - cmake/ExportDependencies.cmake
    - cmake/dependency_snapshot.py
    - tests/maintenance/test_dependency_snapshot.py
    - .github/workflows/dependency-submission.yml
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cpp-dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test dependency inventory and snapshot contracts
      run: python3 -I -S -B -m unittest discover -s tests/maintenance -p test_dependency_snapshot.py -v
    - name: Generate reviewable dependency snapshot
      run: python3 -I -S -B cmake/dependency_snapshot.py --output build/dependency-graph/snapshot.json
    - name: Save snapshot
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cpp-dependency-snapshot
        path: |
          build/dependency-graph/snapshot.json
          build/dependency-graph/snapshot.md
        retention-days: 14
        if-no-files-found: error
  submit:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Generate snapshot for this commit
      run: python3 -I -S -B cmake/dependency_snapshot.py --output build/dependency-graph/snapshot.json
    - name: Submit to GitHub Dependency Graph
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
          -H 'Accept: application/vnd.github+json' \
          -H 'X-GitHub-Api-Version: 2026-03-10' \
          --input build/dependency-graph/snapshot.json > build/dependency-graph/response.json
        jq -e '.result == "SUCCESS"' build/dependency-graph/response.json
        printf '\nSubmitted snapshot **%s** to GitHub Dependency Graph.\n' \
          "$(jq -r '.id' build/dependency-graph/response.json)" >> "$GITHUB_STEP_SUMMARY"

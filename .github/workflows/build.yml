name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
            products: all-windows
          - os: ubuntu-24.04
            preset: native
            products: all-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: ${{ runner.os }}-static-deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/QtStatic.cmake') }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }} --target arduino-setup
      - run: cmake --build --preset ${{ matrix.products }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - if: runner.os == 'Windows'
        run: cmake --build --preset release
      - run: cmake --build build/${{ matrix.preset }} --target audit
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: allpowers-${{ runner.os }}
          path: dist/
